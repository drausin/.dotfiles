# ---------------------------------------------------------------------------
# Terminal & color
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true-color (RGB) passthrough

# Shell (macOS: /bin/zsh, Linux: /usr/bin/zsh)
if-shell "test -x /bin/zsh" \
    "set-option -g default-shell /bin/zsh" \
    "set-option -g default-shell /usr/bin/zsh"

# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10          # faster escape for neovim
set -g focus-events on          # required for neovim autoread
set-option -g renumber-windows on

# ---------------------------------------------------------------------------
# Vi mode & clipboard
# ---------------------------------------------------------------------------
setw -g mode-keys vi

# vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

# OSC 52 passthrough for clipboard over SSH
set -g set-clipboard on
set -g allow-passthrough on   # required since tmux 3.3 for OSC52 clipboard writes from client programs (e.g. Claude Code)
set -ga terminal-overrides ',*:Ms=\E]52;c;%p2%s\a'

# ---------------------------------------------------------------------------
# Pane splits & navigation (kept from original)
# ---------------------------------------------------------------------------
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Navigate between panes with Ctrl+Arrow keys
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Resize panes with Shift+Arrow keys
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# Expand/equalize pane height (within current column)
bind V resize-pane -y 99%
bind v run-shell 'x=$(tmux display -p "##{pane_left}"); n=$(tmux list-panes -F "##{pane_left}" | grep -c "^${x}$"); pct=$((100 / n)); for pid in $(tmux list-panes -F "##{pane_left}:##{pane_id}" | grep "^${x}:" | cut -d: -f2); do tmux resize-pane -t "$pid" -y "${pct}%"; done'

# Expand/equalize pane width
bind H resize-pane -x 99%
bind h run-shell 'n=$(tmux list-panes -F "##{pane_left}" | sort -u | wc -l); pct=$((100 / n)); for pid in $(tmux list-panes -F "##{pane_id}"); do tmux resize-pane -t "$pid" -x "${pct}%"; done'

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-style 'bg=#00afaf,fg=black'
set -g status-interval 60
set -g status-justify centre
set -g status-left-length 20
set -g status-right-length 140
set -g status-left '(#S) #(whoami)'
set -g status-right '#(date +"%Y-%m-%d %H:%M") #H'

# Pane borders
set -g pane-border-style fg=blue
set -g pane-active-border-style fg=brightred

# Window list
setw -g window-status-current-format "#[fg=black,bold]#I:#W#F"
setw -g window-status-format "#[fg=black,dim]#I:#W#F"

# ---------------------------------------------------------------------------
# Popup keybinding — markdown preview with glow
# ---------------------------------------------------------------------------
bind m run-shell 'tmux popup -w 80% -h 80% -E "glow -p #{pane_current_path}/README.md 2>/dev/null || echo No README.md found"'

# ---------------------------------------------------------------------------
# TPM (Tmux Plugin Manager)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
